<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>liquid-gpu · gpu test</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --label: #000; --secondary: rgba(60,60,67,0.6); --sep: rgba(60,60,67,0.29); --tint: #0088ff; }
  html.dark { --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,0.6); --sep: rgba(84,84,88,0.65); --tint: #0091ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font: 17px/1.29 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  /* Every direct child of the canvas is a drawable layer. Sizes are set here; positions come from the GPU transform. */
  #list { width: 100vw; height: 100vh; overflow-y: auto; overflow-x: hidden; background: var(--bg); color: var(--label); box-sizing: border-box; padding: 108px 0 140px; scrollbar-width: none; }
  #list::-webkit-scrollbar { display: none; }
  .large-title { font-size: 34px; font-weight: 700; letter-spacing: 0.4px; margin: 0 20px 8px; }
  .hero { margin: 8px 16px 20px; height: 230px; border-radius: 26px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
  .hero span { position: absolute; left: 18px; bottom: 14px; color: #fff; font-weight: 700; font-size: 26px; text-shadow: 0 1px 8px rgba(0,0,0,0.35); }
  .section { margin: 0 16px 22px; background: var(--card); border-radius: 26px; overflow: hidden; }
  .row { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; left: 76px; right: 0; top: 0; height: 0.5px; background: var(--sep); }
  .row img { width: 46px; height: 46px; border-radius: 11px; object-fit: cover; flex: none; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t i { display: block; font-style: normal; color: var(--secondary); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .chev { color: var(--secondary); font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 0 0 22px; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  p.body { margin: 0 20px 18px; color: var(--label); }

  /* Foreground (labels/icons) layers that sit on top of glass. Transparent backgrounds. */
  .fg { display: flex; align-items: center; justify-content: center; color: var(--label); font-weight: 600; user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer; }
  .icon { width: 24px; height: 24px; }
  #navTitle { width: 220px; height: 44px; font-size: 17px; pointer-events: none; }
  #navBack { width: 44px; height: 44px; border-radius: 22px; }
  #navRight { width: 96px; height: 44px; justify-content: space-around; padding: 0 6px; box-sizing: border-box; }
  #navRight button { all: unset; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 20px; cursor: pointer; }
  #fabA, #fabB { width: 58px; height: 58px; border-radius: 29px; }
  #tabs { width: 274px; height: 62px; justify-content: space-around; padding: 0 4px; box-sizing: border-box; }
  #tabs .tab { width: 88px; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 10px; font-weight: 600; color: var(--label); }
  #tabs .tab.sel { color: var(--tint); }
  #hud { width: 200px; height: 20px; font: 600 11px ui-monospace, Menlo, monospace; color: var(--secondary); justify-content: flex-start; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="stage" content="drawable" layoutsubtree>
  <div id="list" drawable tabindex="0" aria-label="ფოტოები">
    <div class="large-title">ფოტოები</div>
    <div class="hero" id="hero"><span>თბილისი · ძველი ქალაქი</span></div>
    <div class="section" id="rows"></div>
    <div class="grid" id="grid"></div>
    <p class="body">საქართველო მდებარეობს ევროპისა და აზიის გასაყარზე. დედაქალაქი თბილისი მტკვრის ხეობაში გაშენებული ძველი ქალაქია, რომლის ქუჩებიც სავსეა აივნებით, გოგირდის აბანოებითა და ეკლესიებით.</p>
    <div class="section" id="rows2"></div>
    <div class="hero" id="hero2"><span>ყაზბეგი · გერგეტი</span></div>
  </div>
  <div id="navBack" class="fg" drawable role="button" tabindex="0" aria-label="უკან">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>
  </div>
  <div id="navTitle" class="fg" drawable>ალბომები</div>
  <div id="navRight" class="fg" drawable>
    <button id="toggle" aria-label="Light / dark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
    <button aria-label="მეტი"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div id="fabA" class="fg" drawable role="button" tabindex="0" aria-label="დამატება">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>
  <div id="fabB" class="fg" drawable role="button" tabindex="0" aria-label="ძებნა">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
  </div>
  <div id="tabs" class="fg" drawable role="tablist">
    <div class="tab sel" role="tab" data-i="0"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="18" height="14" rx="3"/></svg>ფოტოები</div>
    <div class="tab" role="tab" data-i="1"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>ალბომები</div>
    <div class="tab" role="tab" data-i="2"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>ძებნა</div>
  </div>
  <div id="hud" class="fg" drawable></div>
</canvas>
<script type="module" src="./main.ts"></script>
</body>
</html>
